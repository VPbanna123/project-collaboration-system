syntax = "proto3";

package notification;

import "common.proto";

service NotificationService {
  rpc SendNotification (SendNotificationRequest) returns (NotificationResponse);
  rpc GetUserNotifications (GetUserNotificationsRequest) returns (NotificationsResponse);
  rpc MarkAsRead (MarkAsReadRequest) returns (common.Response);
  rpc MarkAllAsRead (MarkAllAsReadRequest) returns (common.Response);
}

message Notification {
  string id = 1;
  string user_id = 2;
  string type = 3;
  string title = 4;
  string message = 5;
  string link = 6;
  bool is_read = 7;
  string created_at = 8;
}

message SendNotificationRequest {
  string user_id = 1;
  string type = 2;
  string title = 3;
  string message = 4;
  string link = 5;
}

message GetUserNotificationsRequest {
  string user_id = 1;
  int32 limit = 2;
}

message MarkAsReadRequest {
  string id = 1;
}

message MarkAllAsReadRequest {
  string user_id = 1;
}

message NotificationResponse {
  bool success = 1;
  Notification notification = 2;
  string error = 3;
}

message NotificationsResponse {
  bool success = 1;
  repeated Notification notifications = 2;
  int32 unread_count = 3;
  string error = 4;
}